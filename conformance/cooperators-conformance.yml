note: >-
  Standards posture for The Co-operators group. The finding for this carrier is largely negative and
  that is itself the signal: a top-tier Canadian multi-line insurer publishes no data-standards
  posture at all. Nothing below is asserted from a compliance page — The Co-operators publishes no
  trust centre, no certification list and no security disclosure programme (probed 2026-07-25).
standards:
  - id: oauth2-client-credentials
    conforms: true
    evidence: >-
      Duuo documents OAuth 2.0 with the client_credentials grant, client id/secret as an HTTP Basic
      header, JSON body grant_type=client_credentials, and a Bearer token on subsequent calls.
  - id: rfc6749-oauth2
    conforms: true
    evidence: Token response is the standard access_token / expires_in / token_type shape (3600s, Bearer).
  - id: rfc6750-bearer-token
    conforms: true
    evidence: 'Authorization: Bearer {access_token} on every operation.'
  - id: oauth2-scopes
    conforms: false
    evidence: No scopes are published; entitlement is per-partner and enforced server-side (403 "Requires Access Mgmt").
