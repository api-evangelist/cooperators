regulatory_context:
  jurisdiction: Canada
  note: >-
    Canada has no open-insurance or open-data mandate for insurers, and Canada's consumer-driven
    banking framework does not reach insurance carriers. Nothing legally compels The Co-operators to
    publish an API, which is the structural reason this surface is partner-gated and thin. The
    binding compliance regime Duuo does enforce on partners is conduct regulation — licensed
    representative handling of coverage questions, mandatory consent capture and disclosure text,
    credit-check consent, and a pre-go-live compliance review — not a data standard.
compliance_program:
