aid: cooperators
name: The Co-operators
review:
  question: Does The Co-operators expose a public, self-serve developer portal or downloadable API specifications?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Canada
  tier: carrier-pc
findings:
  summary: |
    The Co-operators is a Canadian multi-line insurance and financial services
    co-operative (P&C, life, farm, travel, group benefits, group retirement,
    wealth and institutional asset management), formed in 1978 from the
    amalgamation of the Saskatchewan and Ontario co-operative insurers, with
    more than $62 billion in assets under administration, nearly 7,000
    employees and more than 2,800 licensed insurance representatives.

    There is no first-party developer portal. Every candidate developer
    subdomain fails to resolve in DNS and every candidate path on the corporate
    site returns HTTP 404. The advisor and broker channel is a set of sign-in
    walls, not an integration surface, and the sign-in landing page names no
    API, no developer documentation, and no data-exchange standard.

    The one real API surface in the group belongs to Duuo, the embedded
    insurance brand owned by The Co-operators. Duuo publicly advertises a
    developer portal at https://developer.duuo.ca/ and states that partners can
    "view our API documentation" there. That host is a Postman public-hosted
    documentation domain (CNAME to phs.getpostman.com) and it returns HTTP 404
    as of the review date — the published collection has been unpublished, and
    the underlying Postman documenter URL 404s as well. Duuo's marketing pages
    still link to the dead portal.

    Because the portal was live as recently as 2026-02-06, an archived capture
    of the published collection was retrieved from the Internet Archive to
    characterise the surface honestly (see provenance below). It documented
    quote and bind/issue for two products and nothing else. Access was never
    self-serve at any point: the portal's own onboarding text requires a
    discovery call, a signed partnership agreement, an assigned Partner Account
    Manager, issued API access credentials, and a compliance review before
    go-live, with "more detailed API reference documentation" delivered only
    during onboarding.

    No ACORD, AL3, ACORD XML, NGDS or CSIO reference was found in any Co-operators
    or Duuo public material, and The Co-operators does not appear in the public
    CSIO member directory (CSIO being Canada's P&C data-standards body and the
    domestic analogue of ACORD). The absence of any published data-standards
    posture is itself the finding for this carrier.
