actions:
  openapiDirectoryCreated: false
  specsSaved: 0
  apisListed: 1
  reason: >-
    A single apis[] entry was recorded for the Duuo Platform API — a real, company-published
    partner API — with its live marketing documentation as the human URL. No OpenAPI,
    AsyncAPI, Postman or GraphQL artifact was saved because none is currently published. The
    correct reading of this provider is that a large Canadian multi-line carrier ships no
    public self-serve API, and its one embedded-insurance API is contract-gated with a dead
    documentation portal.
