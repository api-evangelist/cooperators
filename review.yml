    portalConfirmed: false
    gated: true
  specifications:
    openapiHarvested: false
    count: 0
    probes:
      - url: https://www.cooperators.ca/openapi.json
        status: 404
      - url: https://www.cooperators.ca/swagger.json
        status: 404
      - url: https://www.cooperators.ca/api-docs
        status: 404
    note: >-
      No OpenAPI, Swagger, AsyncAPI or Protobuf artifact is published by The Co-operators,
      Duuo, Sovereign Insurance or CUMIS. Nothing was saved; the openapi/ directory is
      deliberately absent.
  acordPosture:
    summary: no ACORD reference found
    detail: >-
      Searched Co-operators and Duuo public pages, the advisor sign-in surface, and the
      archived Duuo developer-portal collection for ACORD, AL3, ACORD XML, NGDS, IVANS and
      CSIO. Zero matches (the single "EDI" string hit in the Duuo collection was a substring
      of "POST-REDIRECTION", not an EDI reference). The Co-operators does not appear in the
      public CSIO member directory at https://csio.com/membership/member-directory (HTTP 200,
      no login required), CSIO being the Canadian P&C data-standards body whose XML standards
      are the domestic counterpart to ACORD XML. No agency-download, AL3 or broker
      data-exchange posture is published.
  insuranceVerbs:
    quote: true
    bind: true
    issue: true
    fnol: false
    audience: partner-only
    note: >-
      Quote and bind/issue are covered by the Duuo Platform API for tenant and event
      insurance only, and only for contracted embedded partners. No claims or FNOL API is
      published anywhere in the group. The Co-operators' own P&C, life, farm, group benefits
      and wealth lines expose no quote, bind, issue or FNOL API at all.
  authModel:
    scheme: OAuth 2.0 client_credentials
    detail: >-
      Duuo Platform API: POST to a partner-issued token URL with an HTTP Basic
      Authorization header of Base64(client_id + ":" + client_secret) and a JSON body of
      {"grant_type":"client_credentials"}; the returned token is sent as a Bearer token on
      subsequent calls. Credentials are issued by a Partner Account Manager after a signed
      partnership agreement. No public host, no self-serve key issuance, no sandbox signup.
    wellKnown:
      - url: https://www.cooperators.ca/.well-known/openid-configuration
        status: 404
      - url: https://www.cooperators.ca/.well-known/oauth-authorization-server
        status: 404
  webhooks:
    exists: false
    note: No event catalog, webhook documentation or AsyncAPI was found for any brand in the group.
  graphql:
    exists: false
    note: No /graphql surface was advertised or discovered.
  postman:
    publicCollections: false
    detail: >-
      Two Postman teams exist for the brand — "Duuo by The Cooperators" (public handle
      duuo-by-the-cooperators, id 6430694) and "Unqork - Duuo Partner API Team" (public
      handle unqork-duuo, id 4892515) — but the Postman public search index reports
      collectionCount 0 and workspaceCount 0 for both, and the custom docs domain
      developer.duuo.ca 404s. There is no live public Postman collection.
  sourceCode:
    githubOrganization: false
    note: >-
      No GitHub organization belongs to The Co-operators. github.com/cooperators is an
      unrelated UK account (2 template repos) and github.com/Co-operators is an unrelated
      2016 account with one .NET socket repo. github.com/duuo and github.com/cumis do not exist.
  transports:
    - protocol: REST
      scheme: https
      documented: partner-only
      note: >-
        Duuo Platform API over HTTPS at a partner-issued host; paths documented as
        /api/v1/event/* and /api/v1/tenant/*. No public base URL is published.
    - protocol: SOAP
      documented: false
    - protocol: GraphQL
      documented: false
    - protocol: gRPC
      documented: false
    - protocol: WebSocket
      documented: false
    - protocol: ACORD/AL3 or CSIO EDI
      documented: false
      note: No agency-download or data-exchange transport is published.
  endpointsObservedArchived:
    provenance:
      source: https://web.archive.org/web/20240127073206/https://developer.duuo.ca/api/collections/26639007/2s93sXcubU
      collectionName: Developer Portal
      postmanCollectionId: '26639007'
      postmanPublishId: 2s93sXcubU
      archivedCaptureDate: '2024-01-27'
      lastLiveArchivedSnapshot: '2026-02-06'
      liveStatusOnReviewDate: 404
      fetchedForReview: '2026-07-25'
      note: >-
        Endpoints below were read from an Internet Archive capture of Duuo's own published
        Postman collection. They are recorded as evidence of the historical documented
        surface only. They are NOT live-verified, no spec file was saved, and the collection
        is no longer published. The archived collection also embedded an expired 2023 example
        JWT, which was deliberately not committed to this repo.
    authorization:
      - POST {token-url}
    eventInsurance:
      - POST {url}/api/v1/event/entity
      - POST {url}/api/v1/event/quote
      - GET {url}/api/v1/event/quote/{quoteId}
      - POST {url}/api/v1/event/quote/{quoteId}/payment
      - POST {url}/api/v1/event/policy
      - PUT {url}/api/v1/event/policy/{policyId}/email
    tenantInsurance:
      - POST {url}/api/v1/tenant/eligibility
      - PUT {url}/api/v1/tenant/quote/{quoteSubmissionId}
      - PUT {url}/api/v1/tenant/quote/{quoteSubmissionId}/addinsured
      - PUT {url}/api/v1/tenant/quote/{quoteSubmissionId}/payment
