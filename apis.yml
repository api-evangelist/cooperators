- aid: cooperators:cooperators-event-insurance-api
  name: The Co-operators Event Insurance API
  description: >-
    Quote and bind Duuo event insurance. Ordered flow — create entity, create quote, get quote, make payment.
    With bindOnPayment=true (the default for API partners) the policy is created and emailed automatically
    on successful payment; with bindOnPayment=false the partner must also call Create Policy and Email
    Policy.
  humanURL: https://duuo.ca/embedded-partners/
