name: The Co-operators
kind: company
description: >-
  The Co-operators is a Canadian insurance and financial services co-operative, formed in 1978 from the
  amalgamation of the Saskatchewan and Ontario co-operative insurers whose roots run back to the
  Co-operative Life Insurance Company founded in Regina in 1945. It is owned by Canadian co-operatives,
  credit union centrals and farm organizations rather than public shareholders, and writes multi-line
  property and casualty, home, auto, farm, travel and life insurance alongside group benefits, group
  retirement and savings, wealth management and institutional asset management, reporting more than
  $62 billion in assets under administration, nearly 7,000 employees and more than 2,800 licensed
  insurance representatives across Canada. Its API posture is partner-gated. There is no first-party
  developer portal on cooperators.ca — developer, developers, docs, api and partners subdomains do not
  resolve in DNS, and /developers, /developer, /api, /partners and /integrations all return HTTP 404 —
  while the advisor and broker channel is a set of sign-in walls (lifeportal.cooperators.ca,
  benefitsnowlogon.cooperators.ca, basis.cooperators.ca, illustration.cumis.com). The only public API
  surface in the group belongs to its embedded-insurance brand Duuo, whose Duuo Platform partner APIs
  cover account, quote, payment and policy issuance for tenant and event insurance behind a signed
  partnership agreement and issued OAuth 2.0 client credentials; the developer portal Duuo advertises
  at developer.duuo.ca is a Postman-hosted documentation domain that returns HTTP 404 as of 2026-07-25.
  No ACORD, AL3 or CSIO reference was found anywhere in the company's public materials.
