apis:
- aid: cooperators:duuo-platform-api
  name: Duuo Platform API
  description: >-
    Partner-gated embedded insurance API from Duuo, the digital insurance brand of The Co-operators.
    Duuo's own published documentation describes APIs for account, quote and policy, risk rating and
    payment so partners can embed tenant and event insurance into their own applications. Access is not
    self-serve: partners engage the Duuo partnerships team, sign a partnership agreement, are assigned a
    Partner Account Manager, and are then issued API access credentials, a partner-specific host and the
    detailed API reference. Authentication is OAuth 2.0 client_credentials, with the client id and secret
    supplied as an HTTP Basic header to a partner-issued token URL and the resulting bearer token sent on
    every call. The publicly published operations covered quote and bind/issue for two products — event
    insurance (create entity, create quote, get quote, make payment, create policy, email policy) and
    tenant insurance (check eligibility, update quote, add insured, make payment) — with no claims or
    FNOL surface. The developer portal Duuo links to from duuo.ca, https://developer.duuo.ca/, is a
    Postman-hosted documentation domain that returned HTTP 404 on 2026-07-25; the collection it published
    has been unpublished, so no live public reference remains. The OpenAPI 3.1 in this repo is a
    derivation by API Evangelist from an Internet Archive capture of that same Duuo-published Postman
    collection — ten operations across two strictly ordered product flows, with Duuo's own request and
    response examples, error shapes and Partner Accepted Testing values carried through. It is a
    historical, non-live-verified reconstruction, not a provider-published spec. Consent booleans are
    load-bearing request fields on both flows, there is no idempotency key on the money- and
    policy-binding writes, and no webhook, claims, policy-read or quote-status operation exists.
  humanURL: https://duuo.ca/embedded-partners/
