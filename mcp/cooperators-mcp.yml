  show what an agent-facing surface over this API would look like. Nothing here is callable today.
server:
  name: duuo-platform
  transport: http
  url: null
  auth: >-
    Would inherit the API's OAuth 2.0 client_credentials model — partner-issued client id/secret,
    partner-issued host, 60-minute bearer token.
agent_cautions:
  - >-
    Both flows are strictly ordered; a tool-calling agent that reorders steps will error. Ordering
    is a hard constraint, not a hint.
  - >-
    make_event_payment, create_event_policy and make_tenant_payment bind real insurance contracts
    and move real money. There is no idempotency key, so a retried call can double-bind.
  - >-
    Consent fields are legally load-bearing. An agent must not set personalInfoConsent,
    creditScoreConsent, thirdPartySharingConsent, paymentAndTermsOfUseConsent, generalConsent or
    emailConsent to true on a human's behalf without that human having seen Duuo's verbatim
    disclosure text.
  - >-
    check_tenant_eligibility triggers a soft credit check on a real consumer.
  - >-
    Any coverage question must be redirected to a licensed insurance representative
    (info@duuo.ca) — Duuo's compliance guide forbids the integrator answering it.
